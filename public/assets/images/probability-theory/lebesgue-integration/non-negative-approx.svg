<svg viewBox="-40 0 440 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    :root { 
      --text: #374151; 
      --axis: #9ca3af; 
      --curve: #a78bfa; 
      --h1: #ec4899; 
      --h2: #3b82f6; 
      --grid: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root { 
        --text: #d1d5db; 
        --axis: #6b7280; 
        --curve: #c4b5fd; 
        --h1: #f472b6; 
        --h2: #60a5fa;
        --grid: #374151;
      }
    }
    .axis { stroke: var(--axis); stroke-width: 1.5; fill: none; }
    .grid { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 4; }
    .curve { stroke: var(--curve); stroke-width: 2; fill: none; }
    .h1-line { stroke: var(--h1); stroke-width: 4; fill: none; stroke-linecap: round; }
    .h2-line { stroke: var(--h2); stroke-width: 4; fill: none; stroke-linecap: round; }
    .projection { stroke: var(--axis); stroke-width: 1; stroke-dasharray: 3; opacity: 0.5; }
    .text { fill: var(--text); font-size: 14px; }
    .label { font-weight: bold; font-family: 'KaTeX_Math', 'Times New Roman', serif; font-style: italic; }
  </style>

  <defs>
    <!-- Define the curve path once -->
    <path id="curve-path" d="
      M 60 200 
      C 80 200, 80 90, 130 90 
      S 180 140, 200 140 
      S 220 130, 240 130 
      S 280 200, 300 200
    " />

    <!-- 
      Clip Path: Area Under Curve
      Used to mask the 'flat' lines so they only appear where they are 'under' the curve peak.
      (i.e., where line_y > curve_y)
    -->
    <clipPath id="clip-under-curve">
      <path d="
      M 60 200 
      C 80 200, 80 90, 130 90 
      S 180 140, 200 140 
      S 220 130, 240 130 
      S 280 200, 300 200
      L 300 300 L 60 300 Z
      " />
    </clipPath>

    <!-- 
      Clip Path: Region Below n=2 (y >= 120)
      Used to mask the curve so it only appears where it dips below the cutoff line.
    -->
    <clipPath id="clip-below-n2">
      <rect x="0" y="120" width="440" height="200" />
    </clipPath>
  </defs>

  <!-- Axes -->
  <line x1="20" y1="200" x2="380" y2="200" class="axis" marker-end="url(#arrow)" />
  <line x1="40" y1="20" x2="40" y2="210" class="axis" />
  <text x="25" y="80" class="text label">n</text>

  <!-- Grids -->
  <line x1="30" y1="160" x2="380" y2="160" class="grid" /> <!-- n=1 -->
  <line x1="30" y1="120" x2="380" y2="120" class="grid" /> <!-- n=2 -->

  <!-- Main Function f (Lavender) -->
  <use href="#curve-path" class="curve" />

  <!-- Set E1 [110, 210] -->
  <g>
    <!-- h1: Flat line at y=160.
         Strictly speaking, h1 = min(f, 1).
         Since f > 1 everywhere in E1 (curve is above 160), h1 is just the line.
    -->
    <line x1="110" y1="160" x2="210" y2="160" class="h1-line" opacity="1" />
    
    <!-- Projections -->
    <line x1="110" y1="160" x2="110" y2="200" class="projection" />
    <line x1="210" y1="160" x2="210" y2="200" class="projection" />
    
    <!-- Brace -->
    <path d="M 110 205 L 110 210 L 210 210 L 210 205" stroke="var(--h1)" fill="none" stroke-width="1.5" />
    <text x="160" y="225" text-anchor="middle" class="text label" fill="var(--h1)">E₁</text>
  </g>

  <!-- Set E2 [80, 260] -->
  <g>
    <!-- h2 Construction -->
    <!-- Clip everything to E2 range first -->
    <clipPath id="clip-E2">
      <rect x="80" y="0" width="180" height="300" />
    </clipPath>
    
    <g clip-path="url(#clip-E2)">
      <!-- 1. The Flat Cap: Line y=120, clipped to be 'inside/under' the curve peaks -->
      <line x1="0" y1="120" x2="440" y2="120" class="h2-line" clip-path="url(#clip-under-curve)" />
      
      <!-- 2. The Curve Follow: Curve f, clipped to be 'below' the line y=120 -->
      <use href="#curve-path" class="h2-line" clip-path="url(#clip-below-n2)" />
    </g>

    <!-- Projections -->
    <line x1="80" y1="160" x2="80" y2="230" class="projection" />
    <line x1="260" y1="160" x2="260" y2="230" class="projection" />
    
    <!-- Brace -->
    <path d="M 80 235 L 80 240 L 260 240 L 260 235" stroke="var(--h2)" fill="none" stroke-width="1.5" />
    <text x="170" y="255" text-anchor="middle" class="text label" fill="var(--h2)">E₂</text>
  </g>

</svg>
