<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" style="font-family: serif; background: transparent;" role="img" aria-label="A wavy red curve X over a sample space partitioned contiguously into blocks A, B, C. Over each block, a horizontal blue segment marks the block average — this is the conditional expectation E(X|G). On block A, a red diagonal hatch fills the area under X and a blue diagonal hatch fills the rectangle under the blue segment; the two areas are equal.">
  <style>
    :root {
      --text: #374151;
      --axis: #9ca3af;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #d1d5db;
        --axis: #6b7280;
      }
    }
    .axis { stroke: var(--axis); stroke-width: 1.5; fill: none; }
    .dashed { stroke: var(--axis); stroke-width: 1; stroke-dasharray: 4 4; stroke-opacity: 0.8; fill: none; }
    .block-label { fill: var(--text); font-size: 16px; text-anchor: middle; }
    .omega-label { fill: var(--text); font-size: 16px; }
  </style>

  <defs>
    <pattern id="ce-hatch-x" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ef4444" stroke-width="2.2" stroke-opacity="0.9" />
    </pattern>
    <pattern id="ce-hatch-g" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3b82f6" stroke-width="2.2" stroke-opacity="0.9" />
    </pattern>
    <clipPath id="ce-clip-A">
      <rect x="30" y="0" width="180" height="170" />
    </clipPath>
  </defs>

  <g clip-path="url(#ce-clip-A)">
    <path d="M 30 170 L 30 95 C 55 70 80 55 105 55 C 130 55 165 95 200 130 C 225 145 245 138 270 125 C 290 115 315 135 345 130 C 370 125 395 115 425 100 C 455 85 480 75 510 78 C 540 82 560 92 570 100 L 570 170 Z" fill="url(#ce-hatch-x)" />
  </g>
  <rect x="30" y="90" width="180" height="80" fill="url(#ce-hatch-g)" clip-path="url(#ce-clip-A)" />

  <line x1="210" y1="40" x2="210" y2="170" class="dashed" />
  <line x1="400" y1="40" x2="400" y2="170" class="dashed" />

  <path d="M 30 95 C 55 70 80 55 105 55 C 130 55 165 95 200 130 C 225 145 245 138 270 125 C 290 115 315 135 345 130 C 370 125 395 115 425 100 C 455 85 480 75 510 78 C 540 82 560 92 570 100" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

  <line x1="30" y1="90" x2="210" y2="90" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />
  <line x1="210" y1="128" x2="400" y2="128" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />
  <line x1="400" y1="88" x2="570" y2="88" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />

  <line x1="30" y1="170" x2="570" y2="170" class="axis" />
  <line x1="30" y1="164" x2="30" y2="176" class="axis" />
  <line x1="570" y1="164" x2="570" y2="176" class="axis" />

  <text x="40" y="48" fill="#ef4444" font-size="16">X</text>
  <text x="120" y="192" class="block-label">A</text>
  <text x="305" y="192" class="block-label">B</text>
  <text x="485" y="192" class="block-label">C</text>
  <text x="582" y="184" class="omega-label">Ω</text>
</svg>
