<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" style="font-family: serif; background: transparent;" role="img" aria-label="A parallelogram representing L²(G). Four distinct points: an origin O at the back-left of the plane; Z, a different point at the front-left of the plane, directly below O on the canvas (so the black dashed line connecting them is nearly vertical and represents the Z vector); X, a point above the plane; and E(X|G), a point on the plane directly below X. From O, three lines emanate: an amber solid line up to X (the X vector), a green dashed line across the plane to E(X|G) (the E(X|G) vector), and the black dashed Z line down to the Z dot. From Z, two more lines emanate: a blue solid line up to X (the X minus Z vector) and a purple bold line across the plane to E(X|G) (the E(X|G) minus Z vector). The red dashed line from X drops perpendicularly to E(X|G), with a right-angle marker. The figure forms a tetrahedron with base O-Z-E(X|G) in the plane and apex at X.">
  <style>
    :root { --text: #374151; --axis: #9ca3af; }
    @media (prefers-color-scheme: dark) {
      :root { --text: #d1d5db; --axis: #6b7280; }
    }
    .plane-edge { stroke: var(--axis); stroke-width: 1.5; fill: none; }
    .plane-fill { fill: var(--axis); fill-opacity: 0.08; }
    .label { font-size: 16px; }
    .text-label { fill: var(--text); font-style: italic; font-size: 16px; }
  </style>

  <polygon points="60,260 370,290 450,180 140,150" class="plane-fill" />
  <polygon points="60,260 370,290 450,180 140,150" class="plane-edge" />

  <line x1="170" y1="190" x2="380" y2="210" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" />

  <line x1="170" y1="240" x2="380" y2="210" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" />

  <line x1="170" y1="190" x2="170" y2="240" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round" />

  <line x1="170" y1="190" x2="380" y2="60" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round" />

  <line x1="170" y1="240" x2="380" y2="60" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round" />

  <line x1="380" y1="60" x2="380" y2="210" stroke="#ef4444" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round" />

  <polyline points="380,196 366,196 366,210" fill="none" stroke="var(--text)" stroke-width="1.2" />

  <circle cx="170" cy="190" r="3.5" fill="var(--text)" />
  <circle cx="170" cy="240" r="4" fill="var(--text)" />
  <circle cx="380" cy="60" r="4.5" fill="#f59e0b" />
  <circle cx="380" cy="210" r="4.5" fill="#10b981" />

  <text x="320" y="130" class="label" fill="#f59e0b">X</text>
  <text x="150" y="220" class="text-label">Z</text>
  <text x="220" y="130" class="label" fill="#3b82f6">X − Z</text>
  <text x="392" y="135" class="label" fill="#ef4444">X − E(X | 𝒢)</text>
  <text x="250" y="250" class="label" fill="#10b981">E(X | 𝒢)</text>
  <text x="260" y="190" class="label" fill="#a855f7">E(X | 𝒢) − Z</text>
  <text x="425" y="295" class="text-label">L²(𝒢)</text>
</svg>
