<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" style="font-family: sans-serif; background: transparent;">
  <style>
    :root { 
      --text: #374151; 
      --axis: #9ca3af; 
    }
    @media (prefers-color-scheme: dark) {
      :root { 
        --text: #d1d5db; 
        --axis: #6b7280; 
      }
    }
    .axis { stroke: var(--axis); stroke-width: 2; }
    .tick { stroke: var(--axis); stroke-width: 1; }
    .label { fill: var(--text); font-size: 16px; text-anchor: middle; }
    .func-line { fill: none; stroke-width: 4; stroke-linecap: round; }
    .projection { stroke: var(--axis); stroke-width: 1.5; stroke-dasharray: 4,2; fill: none; }
  </style>

  <g transform="translate(150, 380)">
    <!-- Axis lines -->
    <line x1="0" y1="0" x2="400" y2="0" class="axis" />
    <line x1="0" y1="0" x2="0" y2="-340" class="axis" />

    <!-- X Ticks -->
    <line x1="360" y1="0" x2="360" y2="5" class="tick" />
    <text x="360" y="25" class="label">1</text>
    
    <line x1="180" y1="0" x2="180" y2="5" class="tick" />
    <text x="180" y="25" class="label">1/2</text>
    
    <line x1="120" y1="0" x2="120" y2="5" class="tick" />
    <text x="120" y="25" class="label">1/3</text>
    
    <line x1="90" y1="0" x2="90" y2="5" class="tick" />
    <text x="90" y="25" class="label">1/4</text>

    <!-- Y Ticks -->
    <line x1="-5" y1="-80" x2="0" y2="-80" class="tick" />
    <text x="-20" y="-75" class="label">1</text>
    <line x1="-5" y1="-160" x2="0" y2="-160" class="tick" />
    <text x="-20" y="-155" class="label">2</text>
    <line x1="-5" y1="-240" x2="0" y2="-240" class="tick" />
    <text x="-20" y="-235" class="label">3</text>
    <line x1="-5" y1="-320" x2="0" y2="-320" class="tick" />
    <text x="-20" y="-315" class="label">4</text>

    <!-- Functions -->
    <!-- X1 -->
    <path d="M0,0 L0,-80 M360,-80 L360,0" class="projection" />
    <line x1="0" y1="-80" x2="360" y2="-80" class="func-line" stroke="#ff5252" />
    <text x="370" y="-70" fill="#ff5252" font-weight="bold">X₁</text>

    <!-- X2 -->
    <path d="M0,0 L0,-160 M180,-160 L180,0" class="projection" />
    <line x1="0" y1="-160" x2="180" y2="-160" class="func-line" stroke="#448aff" />
    <text x="190" y="-150" fill="#448aff" font-weight="bold">X₂</text>

    <!-- X3 -->
    <path d="M0,0 L0,-240 M120,-240 L120,0" class="projection" />
    <line x1="0" y1="-240" x2="120" y2="-240" class="func-line" stroke="#ffb74d" />
    <text x="130" y="-230" fill="#ffb74d" font-weight="bold">X₃</text>

    <!-- X4 -->
    <path d="M0,0 L0,-320 M90,-320 L90,0" class="projection" />
    <line x1="0" y1="-320" x2="90" y2="-320" class="func-line" stroke="#69f0ae" />
    <text x="100" y="-310" fill="#69f0ae" font-weight="bold">X₄</text>

  </g>
</svg>
