<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" style="font-family: sans-serif; background: transparent;">
  <style>
    :root { 
      --text: #374151; 
      --axis: #9ca3af; 
    }
    @media (prefers-color-scheme: dark) {
      :root { 
        --text: #d1d5db; 
        --axis: #6b7280; 
      }
    }
    .axis { stroke: var(--axis); stroke-width: 2; }
    .tick { stroke: var(--axis); stroke-width: 1; }
    .label { fill: var(--text); font-size: 16px; text-anchor: middle; }
    .func-label { font-size: 20px; font-weight: bold; }
    .projection { stroke: var(--axis); stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
    .func-on { stroke-width: 4; fill: none; }
  </style>

  <!-- Group 1: X1 -->
  <g transform="translate(50, 50)">
    <!-- Axes -->
    <line x1="0" y1="100" x2="220" y2="100" class="axis" />
    <line x1="0" y1="110" x2="0" y2="-10" class="axis" />
    
    <!-- Ticks -->
    <line x1="200" y1="100" x2="200" y2="105" class="tick" />
    <text x="200" y="125" class="label">1</text>
    <line x1="0" y1="100" x2="0" y2="105" class="tick" />
    <text x="-10" y="125" class="label">0</text>
    <line x1="-5" y1="50" x2="0" y2="50" class="tick" />
    <text x="-15" y="55" class="label" style="text-anchor: end">1</text>

    <!-- X1 (Red) -->
    <!-- Projections -->
    <line x1="0" y1="100" x2="0" y2="50" class="projection" /> <!-- At 0 -->
    <line x1="200" y1="100" x2="200" y2="50" class="projection" /> <!-- At 1 -->
    <!-- Function Line -->
    <line x1="0" y1="50" x2="200" y2="50" class="func-on" stroke="#ef4444" />
    <!-- Label -->
    <text x="100" y="35" class="func-label" fill="#ef4444">X₁</text>
  </g>

  <!-- Group 2: X2, X3 -->
  <g transform="translate(320, 50)">
    <!-- Axes -->
    <line x1="0" y1="100" x2="220" y2="100" class="axis" />
    <line x1="0" y1="110" x2="0" y2="-10" class="axis" />
    
    <!-- Ticks -->
    <line x1="0" y1="100" x2="0" y2="105" class="tick" />
    <text x="-10" y="125" class="label">0</text>
    <line x1="100" y1="100" x2="100" y2="105" class="tick" />
    <text x="100" y="125" class="label">1/2</text>
    <line x1="200" y1="100" x2="200" y2="105" class="tick" />
    <text x="200" y="125" class="label">1</text>

    <!-- X2 (Green): [0, 1/2] ON, [1/2, 1] OFF -->
    <line x1="0" y1="100" x2="0" y2="50" class="projection" /> 
    <line x1="100" y1="100" x2="100" y2="50" class="projection" />
    <!-- ON segment -->
    <line x1="0" y1="50" x2="100" y2="50" class="func-on" stroke="#10b981" />
    <!-- OFF segment (shifted down slightly to y=103) -->
    <line x1="100" y1="100" x2="200" y2="100" class="func-on" stroke="#10b981" stroke-width="3" />
    <text x="50" y="35" class="func-label" fill="#10b981">X₂</text>

    <!-- X3 (Blue): [0, 1/2] OFF, [1/2, 1] ON -->
    <line x1="200" y1="100" x2="200" y2="50" class="projection" />
    <line x1="100" y1="100" x2="100" y2="50" class="projection" />
    <!-- OFF segment (shifted up slightly to y=97) -->
    <line x1="0" y1="100" x2="100" y2="100" class="func-on" stroke="#3b82f6" stroke-width="3" />
    <!-- ON segment -->
    <line x1="100" y1="50" x2="200" y2="50" class="func-on" stroke="#3b82f6" />
    <text x="140" y="35" class="func-label" fill="#3b82f6">X₃</text>
  </g>

  <!-- Group 3: X4, X5, X6 -->
  <g transform="translate(580, 50)">
    <!-- Axes -->
    <line x1="0" y1="100" x2="220" y2="100" class="axis" />
    <line x1="0" y1="110" x2="0" y2="-10" class="axis" />
    
    <!-- Ticks -->
    <line x1="0" y1="100" x2="0" y2="100" class="tick" />
    <text x="-10" y="125" class="label">0</text>
    <line x1="66.6" y1="100" x2="66.6" y2="100" class="tick" />
    <text x="66.6" y="125" class="label">1/3</text>
    <line x1="133.3" y1="100" x2="133.3" y2="100" class="tick" />
    <text x="133.3" y="125" class="label">2/3</text>
    <line x1="200" y1="100" x2="200" y2="100" class="tick" />
    <text x="200" y="125" class="label">1</text>

    <!-- X4 (Red): ON [0, 1/3], OFF rest (y=100) -->
    <line x1="0" y1="100" x2="0" y2="50" class="projection" />
    <line x1="66.6" y1="100" x2="66.6" y2="50" class="projection" />
    <line x1="0" y1="50" x2="66.6" y2="50" class="func-on" stroke="#ef4444" />
    <line x1="66.6" y1="96" x2="200" y2="96" class="func-on" stroke="#ef4444" />
    <text x="25" y="35" class="func-label" fill="#ef4444">X₄</text>

    <!-- X5 (Blue): ON [1/3, 2/3], OFF rest (y=98) -->
    <line x1="133.3" y1="100" x2="133.3" y2="50" class="projection" />
    <line x1="66.6" y1="100" x2="66.6" y2="50" class="projection" />
    <line x1="66.6" y1="50" x2="133.3" y2="50" class="func-on" stroke="#3b82f6" />
    <line x1="0" y1="96" x2="66.6" y2="96" class="func-on" stroke="#3b82f6" />
    <line x1="133.3" y1="100" x2="200" y2="100" class="func-on" stroke="#3b82f6" />
    <text x="90" y="35" class="func-label" fill="#3b82f6">X₅</text>

    <!-- X6 (Green): ON [2/3, 1], OFF rest (y=100) -->
    <line x1="200" y1="100" x2="200" y2="50" class="projection" />
    <line x1="133.3" y1="100" x2="133.3" y2="50" class="projection" />
    <line x1="133.3" y1="50" x2="200" y2="50" class="func-on" stroke="#10b981" />
    <line x1="0" y1="100" x2="133.3" y2="100" class="func-on" stroke="#10b981" />
    <text x="160" y="35" class="func-label" fill="#10b981">X₆</text>
  </g>
</svg>
